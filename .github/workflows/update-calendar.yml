name: Update calendar feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# The class rep tool dispatches this workflow after every save, so several
# can arrive close together. Queue them (never cancel one mid-push); GitHub
# keeps only the newest pending run, which is all that's needed since every
# run rebuilds from the latest committed data.
concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build calendar feeds
        run: python scripts/build_ics.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/ is included for build_ics.py pruning stale whole-school
          # description overrides (data/whole_school_overrides.json).
          if ! git diff --quiet -- docs/calendars/ data/; then
            git add docs/calendars/ data/
            git commit -m "Update calendar feeds"
            # The class rep tool commits straight to main too, possibly
            # while this run was building.
            git pull --rebase
            git push
          else
            echo "No changes to calendar feeds"
          fi
