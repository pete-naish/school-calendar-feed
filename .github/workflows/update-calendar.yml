name: Update calendar feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # For the "Report build problems" step, which opens, updates and closes one
  # issue. Nothing else here touches issues.
  issues: write

# The class rep tool dispatches this workflow after every save, so several
# can arrive close together. Queue them (never cancel one mid-push); GitHub
# keeps only the newest pending run, which is all that's needed since a run
# whose push is rejected rebuilds from the latest committed data (see the
# commit step).
concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # build_ics.py writes what it found wrong (events it had to skip, class
      # codes it didn't recognise...) here, for the last step to report. Set
      # for every later step, including the rebuild inside the push retry.
      - name: Choose where the build report goes
        run: echo "BUILD_REPORT_PATH=$RUNNER_TEMP/build-report.json" >> "$GITHUB_ENV"

      - name: Build calendar feeds
        run: python scripts/build_ics.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # data/ is included for build_ics.py pruning stale whole-school
            # description overrides (data/whole_school_overrides.json).
            if git diff --quiet -- docs/calendars/ data/; then
              echo "No changes to calendar feeds"
              exit 0
            fi
            git add docs/calendars/ data/
            git commit -m "Update calendar feeds"
            git push && exit 0
            # Rejected: the class rep tool (or an earlier run) pushed while
            # this one was building, so the data we built from may be stale.
            # The .ics files can't be merged (every build stamps them with
            # the current time, so any two builds conflict), so drop this
            # build and redo it on top of the new tip.
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_ics.py
          done
          echo "Couldn't push the calendar feeds after 3 attempts" >&2
          exit 1

      # Last, and allowed to fail, so reporting can never stop the feeds being
      # published. Puts the report in the run's summary and keeps a single open
      # "Calendar build problems" issue in step with it: created when problems
      # first appear (that's the one notification), edited quietly while they
      # last, closed once a build finds none.
      - name: Report build problems
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f "$BUILD_REPORT_PATH" ]; then
            echo "No build report was written."
            exit 0
          fi
          python scripts/build_report.py "$BUILD_REPORT_PATH" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

          TITLE="Calendar build problems"
          NUMBER=$(gh issue list --state open --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")

          if python scripts/build_report.py --has-problems "$BUILD_REPORT_PATH"; then
            if [ -n "$NUMBER" ]; then
              gh issue edit "$NUMBER" --body-file "$RUNNER_TEMP/report.md"
            else
              gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/report.md"
            fi
          elif [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "The latest build reported no problems."
          fi
