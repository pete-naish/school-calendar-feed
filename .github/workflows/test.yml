name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only checks out code and runs tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      # Node 24 runs the tool's .ts files directly (type stripping), for the
      # tests; tsc checks them and builds the pages' committed .js.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Neither host runs a build, so the served .js is committed next to its
      # .ts - and has to be what the .ts builds to.
      - name: Check the committed JS is built from the current TS
        run: |
          npm run build
          stale=$(git status --porcelain -- docs/assets/calendar.js tool/app.js tool/appHelpers.js 'tool/page/*.js')
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::Run npm run build and commit the .js files it changes or adds."
            exit 1
          fi

      - name: Run tool tests
        run: npm run test:tool
