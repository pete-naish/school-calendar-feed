name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only checks out code and runs tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Check class-code config hasn't drifted across its 4 copies
        run: python3 scripts/check_config_sync.py

      - name: Run tool tests
        run: node --test "tool/tests/*.test.mjs"
