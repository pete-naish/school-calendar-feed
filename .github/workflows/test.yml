name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only checks out code and runs tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Check class-code config hasn't drifted across its 4 copies
        run: python3 scripts/check_config_sync.py

      - name: Run tool tests
        run: node --test "tool/tests/*.test.mjs"
