# Keeps the pinned GitHub Actions (see .github/workflows) and the Python
# requirements up to date by opening a pull request for each new version.
# The tool has no npm dependencies, so there's nothing to watch there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
